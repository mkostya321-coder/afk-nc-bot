meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"
build:
  requirementsPath: requirements.txt
  useCache: false
  script: |
    pip install --no-cache-dir -r requirements.txt
run:
  scriptName: null
  command: python run.py
  persistenceMount: /data
  containerPort: "80"
  servicePort: "80"
